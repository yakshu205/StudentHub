<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub Login</title>
        <link rel="stylesheet" href="../Practical -3/login.css">
       <script src="../JS/script.js" defer></script>

</head>

<body>
 <!-- complete -->
<center>

    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_msVTJ1UZqmtO-rMykxXBRws_5_EmYQxh7ZsTVTWeQoeh8BjRmlV7sLk&s=10"
        alt="StudentHub Logo" width="150">

    <h1>StudentHub Portal</h1>
    <h3>Welcome Back</h3>

    <p>
        Don't have an account?
        <a href="register.html" id="register-link">Register Here</a>
    </p>

</center>


<div id="notification"></div>
<form action="dashboard.html" method="get" id="login-form">

<center>

   <center>
    <legend><b>Login Form</b></legend>
    </center>

    <table cellpadding="10">

        <tr>
            <td><label for="email">Email</label></td>
            <td>
                <input type="email" id="email"
                    placeholder="Enter Your Email">
            </td>
        </tr>

        <tr>
            <td><label for="password">Password</label></td>
            <td>
                <input type="password" id="password"
                    placeholder="Enter Your Password">
            </td>
        </tr>

        <tr>
            <td colspan="2" align="right">
                <a href="#" id="forgot-password-link">Forgot Password?</a>
            </td>
        </tr>

        

        <tr>
            <td colspan="2" align="center">
                <button type="submit" id="login-btn">Login</button>
                
                <button type="reset" id="clear-btn">Clear</button>
            </td>
        </tr>

    </table>



</center>

</form>



<center>
    <p>
        New User?
        <a href="register.html" id="create-account-link">Create an Account</a>
    </p>

    <small>
        © 2026 StudentHub Portal | All Rights Reserved
    </small>
</center>

</body>
</html>
